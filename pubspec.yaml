name: jeu_2048
description: "Jeu 2048 en Flutter : trois modes de fusion, objectifs de 256 à 8192, grilles de 4x4 à 8x8 et records."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Variable.ttf
